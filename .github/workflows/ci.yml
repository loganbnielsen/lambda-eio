name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.x
      - name: Install opam dependencies
        run: opam install . --deps-only --with-test --with-doc
      - name: Lint opam file
        run: opam exec -- opam lint lambda-eio.opam
      - name: Build
        run: opam exec -- dune build @all
      - name: Test
        run: opam exec -- dune runtest
      - name: RIE protocol-conformance smoke test
        run: opam exec -- test/rie_smoke_test.sh
      - name: Build docs
        run: opam exec -- dune build @doc

  echo-lambda-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container deployment smoke test (no AWS account needed)
        run: examples/echo-lambda/local_test.sh
